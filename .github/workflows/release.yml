name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara para tags que começam com 'v', ex: v1.0.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build Fat JAR
      run: ./gradlew clean fatJar -Pversion=${{ steps.get_version.outputs.VERSION }}

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: lib/build/libs/lib-all.jar
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
